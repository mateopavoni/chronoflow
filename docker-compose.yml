# ChronoFlow — stack local completo: `docker compose up --build`
#   web → http://127.0.0.1:8080    api → http://127.0.0.1:8000/docs
# Postgres NO se publica al host (solo la API lo alcanza por la red interna).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chronoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chronoflow}
      POSTGRES_DB: ${POSTGRES_DB:-chronoflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chronoflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chronoflow}:${POSTGRES_PASSWORD:-chronoflow}@db:5432/${POSTGRES_DB:-chronoflow}
      CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
      ENV: dev
      # The WS handshake goes straight to uvicorn (bypasses the nginx buffer
      # fix in apps/web/nginx.conf). Same root cause: other local apps'
      # cookies pile up on shared "localhost" and the Cookie header exceeds
      # the `websockets` lib's 8KB per-line default, so the upgrade gets a 400.
      WEBSOCKETS_MAX_LINE_LENGTH: "32768"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    mem_limit: 64m

volumes:
  pgdata:
